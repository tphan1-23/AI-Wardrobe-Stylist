<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>DressWell: email confirmation</title>
  <style>
    :root { --ink: #000; --paper: #fff; --muted: #595959; --rule: #d4d4d4; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--paper); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { width: 100%; max-width: 420px; border: 1.5px solid var(--ink); border-radius: 16px; padding: 32px 24px; text-align: center; }
    .brand { margin: 0 0 24px; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .mark { width: 56px; height: 56px; margin: 0 auto 20px; border: 1.5px solid var(--ink); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }
    h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.2; }
    p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #fff; --paper: #000; --muted: #bdbdbd; --rule: #3a3a3a; }
    }
  </style>
</head>
<body data-status="none">
  <main>
    <p class="brand">DressWell</p>
    <div class="mark" id="mark" aria-hidden="true">&#10003;</div>
    <h1 id="title">Email confirmation</h1>
    <p id="body">Checking your link&hellip;</p>
  </main>
  <noscript>
    <p style="text-align:center;margin-top:16px">If your email is confirmed, open the DressWell app and log in.</p>
  </noscript>
  <script type="module" src="./confirmed.js"></script>
</body>
</html>
